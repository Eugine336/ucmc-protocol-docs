openapi: 3.1.0
info:
  title: UCMC Protocol API
  version: 0.1.0
  description: |
    Public API surface for the UCMC protocol. Every actor is identified by an Ed25519
    public key. Mutations are signed in a body envelope; reads are signed via request
    headers. See `verification/README.md` for code examples and `events/schemas.md`
    for the signal opcode catalog.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: https://api.ucmccore.tech
    description: Production
tags:
  - name: identity
    description: Authentication, onboarding, identity verification
  - name: profiles
    description: Profile, portfolio, listings, catalogue
  - name: discovery
    description: Marketplace search, matching
  - name: protocol
    description: Core protocol primitives (challenges, control, capability, reads, value)
  - name: content
    description: Delivery, analytics, storage, templates
  - name: disputes
    description: Dispute resolution and support
  - name: reputation
    description: Reviews and reputation
  - name: communication
    description: Messaging, notifications, streams
  - name: financial
    description: Payments, wallet, tax
  - name: legal
    description: Legal documents, compliance
  - name: recovery
    description: Account recovery
  - name: audit
    description: Audit chain access
  - name: governance
    description: Protocol governance, proposals, voting

components:
  securitySchemes:
    signedBody:
      type: apiKey
      in: header
      name: X-Body-Signed
      description: |
        Request body MUST contain the signed mutation envelope: actorId, publicKey,
        signature, signal, metadata, timestamp, nonce, idempotencyKey, and proof.
        See `verification/README.md` for how to construct and sign the envelope.
    signedHeaders:
      type: apiKey
      in: header
      name: x-signature
      description: |
        Five headers required: x-actor-id, x-public-key, x-timestamp, x-nonce,
        x-signature. The signature covers a canonical string of the other four
        headers. See `verification/README.md` for construction details.

  schemas:
    ActorId:
      type: string
      pattern: '^[0-9a-f]{64}$'
      description: Hex SHA-256 derived from the actor's Ed25519 public key.
    PublicKeyHex:
      type: string
      pattern: '^[0-9a-f]{64}$'
      description: 32-byte Ed25519 public key in hex.
    SignatureHex:
      type: string
      pattern: '^[0-9a-f]{128}$'
      description: 64-byte Ed25519 signature in hex.
    TraceId:
      type: string
      pattern: '^[0-9a-f]{32,64}$'
      description: Unique trace identifier for the operation.
    Nonce:
      type: string
      description: One-time nonce for replay protection.
    Timestamp:
      type: integer
      format: int64
      description: Milliseconds since Unix epoch.
    SignalOpcode:
      type: string
      pattern: '^0x[0-9a-f]{2}$'
      examples:
        - '0x53'
        - '0x02'
        - '0x04'
      description: Two-byte hex opcode identifying the mutation type.
    SignedMutationEnvelope:
      type: object
      required:
        - actorId
        - publicKey
        - signature
        - signal
        - metadata
        - timestamp
        - nonce
        - idempotencyKey
      properties:
        actorId:
          $ref: '#/components/schemas/ActorId'
        publicKey:
          $ref: '#/components/schemas/PublicKeyHex'
        signature:
          $ref: '#/components/schemas/SignatureHex'
        signal:
          $ref: '#/components/schemas/SignalOpcode'
        metadata:
          type: object
          description: Signal-specific payload. Shape varies by opcode.
        timestamp:
          $ref: '#/components/schemas/Timestamp'
        nonce:
          $ref: '#/components/schemas/Nonce'
        traceId:
          $ref: '#/components/schemas/TraceId'
        idempotencyKey:
          type: string
          description: Client-generated key for idempotent mutations.
        proof:
          type: object
          properties:
            contextHash:
              type: string
            proofHash:
              type: string
    Response:
      type: object
      required:
        - ok
      properties:
        ok:
          type: boolean
        data:
          type: object
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
    ErrorResponse:
      type: object
      required:
        - ok
        - error
      properties:
        ok:
          type: boolean
          const: false
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string
    Money:
      type: string
      pattern: '^[0-9]+$'
      description: Monetary amount in minor units (BigInt string).
    Email:
      type: string
      format: email
    KycStatus:
      type: string
      enum:
        - NOT_STARTED
        - PENDING
        - PENDING_REVIEW
        - VERIFIED
        - REJECTED
        - EXPIRED
        - SANCTIONS_HIT
    DisputeStatus:
      type: string
      enum:
        - OPEN
        - EVIDENCE
        - VOTING
        - RESOLVED
        - CANCELLED
    DisputeOutcome:
      type: string
      enum:
        - BUYER
        - SELLER
        - SPLIT
        - CANCELLED
    WithdrawalStatus:
      type: string
      enum:
        - PENDING
        - TIMELOCKED
        - RELEASED
        - CANCELLED
    WithdrawalSettlementStatus:
      type: string
      enum:
        - SUBMITTED
        - SETTLED
        - FAILED
    DeliveryMode:
      type: string
      enum:
        - FILE
        - ACCESS
        - MANUAL
    ActorRole:
      type: string
      enum:
        - BUYER
        - SELLER
        - BOTH
    LegalJurisdiction:
      type: string
      description: Jurisdiction code for legal compliance.
    MutationResponse:
      type: object
      properties:
        ok:
          type: boolean
        committed:
          type: boolean
        actorId:
          $ref: '#/components/schemas/ActorId'
        traceId:
          $ref: '#/components/schemas/TraceId'

  responses:
    Unauthorized:
      description: Missing or invalid authentication.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            ok: false
            error:
              code: unauthorized
              message: Missing or invalid signature.
    Forbidden:
      description: Authenticated but insufficient permissions.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            ok: false
            error:
              code: forbidden
              message: Actor does not have permission for this action.
    TimestampDrift:
      description: Request timestamp exceeds allowed drift window.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            ok: false
            error:
              code: timestamp_drift_exceeded
              message: Request timestamp is outside the acceptable drift window.
    Replay:
      description: Nonce has already been consumed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            ok: false
            error:
              code: replay_detected
              message: This nonce has already been used.
    RateLimited:
      description: Too many requests.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            ok: false
            error:
              code: rate_limited
              message: Too many requests. Try again later.
    ServerError:
      description: Internal server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            ok: false
            error:
              code: internal_error
              message: An unexpected error occurred.

paths:
  # ──────────────────────────────────────────────
  # tag: identity
  # ──────────────────────────────────────────────

  /auth/oauth/callback:
    post:
      operationId: oauthCallback
      summary: Complete OAuth callback and return actor credentials.
      tags: [identity]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, code, state, codeVerifier]
              properties:
                provider:
                  type: string
                code:
                  type: string
                state:
                  type: string
                codeVerifier:
                  type: string
      responses:
        '200':
          description: OAuth exchange successful.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    type: object
                    properties:
                      actorId:
                        $ref: '#/components/schemas/ActorId'
                      encryptedKeypair:
                        type: string
        '400':
          $ref: '#/components/responses/TimestampDrift'
        '500':
          $ref: '#/components/responses/ServerError'

  /auth/oauth/keypair:
    post:
      operationId: oauthKeypair
      summary: Exchange OAuth session for an encrypted keypair.
      tags: [identity]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, sessionToken]
              properties:
                provider:
                  type: string
                sessionToken:
                  type: string
      responses:
        '200':
          description: Keypair returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    type: object
                    properties:
                      encryptedKeypair:
                        type: string
                      publicKey:
                        $ref: '#/components/schemas/PublicKeyHex'
        '500':
          $ref: '#/components/responses/ServerError'

  /auth/providers:
    get:
      operationId: listAuthProviders
      summary: List supported OAuth providers.
      tags: [identity]
      security: []
      responses:
        '200':
          description: Provider list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    type: object
                    properties:
                      providers:
                        type: array
                        items:
                          type: string

  /onboarding/status/{actorId}:
    get:
      operationId: getOnboardingStatus
      summary: Aggregated onboarding status for an actor.
      tags: [identity]
      security:
        - signedHeaders: []
      parameters:
        - name: actorId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ActorId'
      responses:
        '200':
          description: Onboarding status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    type: object
                    properties:
                      terms:
                        type: object
                        properties:
                          accepted:
                            type: boolean
                      email:
                        type: object
                        properties:
                          bound:
                            type: boolean
                          verified:
                            type: boolean
                      profile:
                        type: object
                        properties:
                          created:
                            type: boolean
                      kyc:
                        type: object
                        properties:
                          status:
                            $ref: '#/components/schemas/KycStatus'
                      role:
                        type: object
                        properties:
                          selected:
                            type: boolean
                      completed:
                        type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'

  /onboarding/terms:
    post:
      operationId: acceptTerms
      summary: Accept platform terms of service. Signal 0x69. Idempotent.
      tags: [identity]
      security:
        - signedBody: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignedMutationEnvelope'
      responses:
        '200':
          description: Terms accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MutationResponse'
        '409':
          description: Terms already accepted (idempotent duplicate).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /onboarding/bind-email:
    post:
      operationId: bindEmail
      summary: Bind an email address to the actor identity. Signal 0x68.
      tags: [identity]
      security:
        - signedBody: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/SignedMutationEnvelope'
                - type: object
                  properties:
                    metadata:
                      type: object
                      properties:
                        email:
                          $ref: '#/components/schemas/Email'
      responses:
        '200':
          description: Email bound. OTP sent for verification.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MutationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Replay'

  /onboarding/verify-email:
    post:
      operationId: verifyEmail
      summary: Verify a 6-digit OTP sent to the bound email.
      tags: [identity]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actorId, otp, publicKey, signature, timestamp, nonce]
              properties:
                actorId:
                  $ref: '#/components/schemas/ActorId'
                otp:
                  type: string
                  pattern: '^\d{6}$'
                publicKey:
                  $ref: '#/components/schemas/PublicKeyHex'
                signature:
                  $ref: '#/components/schemas/SignatureHex'
                timestamp:
                  $ref: '#/components/schemas/Timestamp'
                nonce:
                  $ref: '#/components/schemas/Nonce'
      responses:
        '200':
          description: Email verified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
        '400':
          description: Invalid or expired OTP.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'

  /onboarding/resend-verify:
    post:
      operationId: resendVerifyEmail
      summary: Resend the verification OTP. Cooldown applies.
      tags: [identity]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actorId]
              properties:
                actorId:
                  $ref: '#/components/schemas/ActorId'
      responses:
        '200':
          description: OTP resent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
        '429':
          $ref: '#/components/responses/RateLimited'

  /onboarding/bind-eth:
    post:
      operationId: bindEthAddress
      summary: Bind an Ethereum address to the actor identity. Signal 0x95.
      tags: [identity]
      security:
        - signedBody: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignedMutationEnvelope'
      responses:
        '200':
          description: Ethereum address bound.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MutationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Replay'

  /kyc/start:
    post:
      operationId: startKyc
      summary: Start identity verification via KYC provider. Signal 0x90.
      tags: [identity]
      security:
        - signedBody: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignedMutationEnvelope'
      responses:
        '200':
          description: KYC session created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    type: object
                    properties:
                      sessionId:
                        type: string
                      sdkUrl:
                        type: string
                        format: uri
        '401':
          $ref: '#/components/responses/Unauthorized'

  /kyc/status/{actorId}:
    get:
      operationId: getKycStatus
      summary: Current KYC verification status for an actor.
      tags: [identity]
      security:
        - signedHeaders: []
      parameters:
        - name: actorId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ActorId'
      responses:
        '200':
          description: KYC status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    type: object
                    properties:
                      kyc_status:
                        $ref: '#/components/schemas/KycStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ──────────────────────────────────────────────
  # tag: profiles
  # ──────────────────────────────────────────────

  /profile/search:
    get:
      operationId: searchProfiles
      summary: Search actor profiles.
      tags: [profiles]
      security: []
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Search results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'

  /profile/batch:
    get:
      operationId: batchGetProfiles
      summary: Fetch multiple profiles by actor IDs.
      tags: [profiles]
      security: []
      parameters:
        - name: actorIds
          in: query
          required: true
          schema:
            type: string
          description: Comma-separated actor IDs.
      responses:
        '200':
          description: Batch profile results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'

  /profile/private/{actorId}:
    get:
      operationId: getPrivateProfile
      summary: Private profile fields. Self-only access.
      tags: [profiles]
      security:
        - signedHeaders: []
      parameters:
        - name: actorId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ActorId'
      responses:
        '200':
          description: Private profile data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /profile/{actorId}/catalogue:
    get:
      operationId: getActorCatalogue
      summary: List catalogue items for an actor.
      tags: [profiles]
      security: []
      parameters:
        - name: actorId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ActorId'
      responses:
        '200':
          description: Catalogue items.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'

  /profile/{actorId}/full:
    get:
      operationId: getFullProfile
      summary: Full public profile for an actor.
      tags: [profiles]
      security: []
      parameters:
        - name: actorId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ActorId'
      responses:
        '200':
          description: Full profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'

  /profile/{actorId}:
    get:
      operationId: getProfile
      summary: Basic public profile for an actor.
      tags: [profiles]
      security: []
      parameters:
        - name: actorId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ActorId'
      responses:
        '200':
          description: Basic profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'

  /profile:
    post:
      operationId: createOrUpdateProfile
      summary: Create or update actor profile. Signal 0x61.
      tags: [profiles]
      security:
        - signedBody: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/SignedMutationEnvelope'
                - type: object
                  properties:
                    metadata:
                      type: object
                      properties:
                        legal_name:
                          type: string
                        display_name:
                          type: string
                        bio:
                          type: string
                        avatar_url:
                          type: string
                          format: uri
                        role:
                          $ref: '#/components/schemas/ActorRole'
      responses:
        '200':
          description: Profile created or updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MutationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Replay'

  /profile/catalogue:
    post:
      operationId: createCatalogueItem
      summary: Create a catalogue item.
      tags: [profiles]
      security:
        - signedBody: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignedMutationEnvelope'
      responses:
        '200':
          description: Catalogue item created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MutationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /profile/catalogue/{id}:
    put:
      operationId: updateCatalogueItem
      summary: Update a catalogue item.
      tags: [profiles]
      security:
        - signedBody: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignedMutationEnvelope'
      responses:
        '200':
          description: Item updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MutationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      operationId: deactivateCatalogueItem
      summary: Deactivate a catalogue item.
      tags: [profiles]
      security:
        - signedBody: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Item deactivated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /profile/catalogue/{id}/update:
    post:
      operationId: updateCatalogueItemAlt
      summary: Update a catalogue item (alternate POST path).
      tags: [profiles]
      security:
        - signedBody: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignedMutationEnvelope'
      responses:
        '200':
          description: Item updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MutationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /profile/catalogue/{id}/deactivate:
    post:
      operationId: deactivateCatalogueItemAlt
      summary: Deactivate a catalogue item (alternate POST path).
      tags: [profiles]
      security:
        - signedBody: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Item deactivated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /profile/photo/{actorId}:
    post:
      operationId: uploadProfilePhoto
      summary: Upload a profile photo. Multipart form data.
      tags: [profiles]
      security:
        - signedHeaders: []
      parameters:
        - name: actorId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ActorId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                photo:
                  type: string
                  format: binary
      responses:
        '200':
          description: Photo uploaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /profile/pending/{pendingId}:
    get:
      operationId: getPendingProfile
      summary: Retrieve a pending profile update.
      tags: [profiles]
      security:
        - signedHeaders: []
      parameters:
        - name: pendingId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Pending profile data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /portfolio/profile/{actorId}/portfolio:
    get:
      operationId: getPublicPortfolio
      summary: Public portfolio for an actor.
      tags: [profiles]
      security: []
      parameters:
        - name: actorId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ActorId'
      responses:
        '200':
