  /control:
    post:
      operationId: submitSignedMutation
      summary: Universal signed mutation endpoint. Signal opcode determines the action.
      description: |
        The primary protocol endpoint. Every state-changing operation is submitted as a
        signed mutation envelope. The `signal` field (an opcode from `events/schemas.md`)
        determines what action is performed. The `metadata` field carries signal-specific
        payload data. Common signals include: 0x53 (initiate purchase), 0x02 (seller accept),
        0x04 (delivery registered), 0x65 (buyer confirm), 0x05 (finalize), 0x66 (review).
      tags: [protocol]
      security:
        - signedBody: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignedMutationEnvelope'
      responses:
        '200':
          description: Mutation committed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MutationResponse'
        '400':
          $ref: '#/components/responses/TimestampDrift'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Replay or idempotency conflict.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                replay:
                  value:
                    ok: false
                    error:
                      code: replay_detected
                      message: This nonce has already been used.
                idempotency:
                  value:
                    ok: false
                    error:
                      code: idempotency_conflict
                      message: A different mutation was already committed with this idempotency key.
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'

